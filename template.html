<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Howl Simples</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; padding: 16px; background: #fff; color: #111 }
  h1 { font-size: 18px; margin: 0 0 4px }
  p { margin: 0 0 12px; color: #555 }
  input, select { padding: 8px; font-size: 14px; margin: 0 8px 12px 0 }
  input { width: 100%; max-width: 420px }
  #board { display: flex; gap: 12px; overflow-x: auto; align-items: flex-start; padding-bottom: 16px }
  .col { flex: 0 0 280px; background: #f4f4f4; border-radius: 6px; padding: 8px }
  .col h2 { font-size: 13px; margin: 0 0 8px; text-transform: uppercase }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 8px; margin-bottom: 8px; cursor: pointer }
  .card:hover { border-color: #999 }
  .cod { font-weight: 600; font-size: 12px; color: #555 }
  .meta { font-size: 12px; color: #555; margin-top: 4px }
  .desc { white-space: pre-wrap; line-height: 1.5; margin-top: 8px; padding-top: 8px; border-top: 1px solid #eee; cursor: auto }
  details.multi { display: inline-block; position: relative; margin: 0 8px 12px 0; vertical-align: top }
  details.multi summary { padding: 8px; border: 1px solid #767676; border-radius: 3px; cursor: pointer; background: #fff; list-style: none }
  details.multi .opts { position: absolute; z-index: 10; background: #fff; border: 1px solid #ccc; border-radius: 4px; padding: 6px; max-height: 260px; overflow: auto; min-width: 200px; box-shadow: 0 2px 8px #0002 }
  details.multi label { display: block; padding: 3px 4px; white-space: nowrap; cursor: pointer }
  a { color: #0645ad }
</style>
</head>
<body>
<h1>Demandas em aberto <small id="n"></small></h1>
<p>Atualizado em __GERADO__</p>
<input id="q" type="search" placeholder="Pesquisar código, título, dev, QA, analista, status…" autofocus>
<span id="filtros"></span>
<div id="board"></div>
<script>
let dados = __DADOS__
const board = document.getElementById('board'), n = document.getElementById('n'), q = document.getElementById('q')
const FILTROS = [['projeto', 'Projeto', true], ['status', 'Status', true], ['dev', 'Dev', true], ['qa', 'QA', true], ['analista', 'Analista', true]]
const sel = {}
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const link = (u) => (/^https?:\/\//.test(u || '') ? ` · <a href="${esc(u)}" target="_blank" rel="noopener">Figma</a>` : '')

// Colunas por nome de status: nomes repetidos (de fluxos diferentes) viram uma só, na menor ordem.
const ordem = {}
dados.forEach((d) => { ordem[d.status] = Math.min(ordem[d.status] ?? Infinity, d.ordem) })
const colunas = Object.keys(ordem).sort((a, b) => ordem[a] - ordem[b])

const card = (d) => `<div class="card"><div class="cod">${esc(d.codigo)}</div>${esc(d.titulo)}
  <div class="meta">${esc(d.projeto)}${link(d.figma)}</div>
  <div class="meta">Dev: ${esc(d.dev) || '-'} · QA: ${esc(d.qa) || '-'} · Analista: ${esc(d.analista) || '-'}</div>
  <div class="desc" hidden>${esc(d.descricao) || '<i>Sem descrição</i>'}</div></div>`

function render() {
  const f = q.value.toLowerCase()
  const lista = dados.filter((d) => FILTROS.every(([k]) => { const v = sel[k](); return !v.length || v.includes(d[k]) }) && Object.values(d).join(' ').toLowerCase().includes(f))
  n.textContent = `(${lista.length})`
  board.innerHTML = colunas.map((c) => {
    const cards = lista.filter((d) => d.status === c)
    return `<div class="col"><h2>${esc(c)} (${cards.length})</h2>${cards.map(card).join('')}</div>`
  }).join('')
}

FILTROS.forEach(([k, rotulo, multi]) => {
  const valores = [...new Set(dados.map((d) => d[k]).filter(Boolean))].sort()
  const alvo = document.getElementById('filtros')
  if (!multi) {
    const s = document.createElement('select')
    s.add(new Option(rotulo + ': todos', ''))
    valores.forEach((v) => s.add(new Option(v, v)))
    s.addEventListener('change', render)
    sel[k] = () => (s.value ? [s.value] : [])
    return alvo.append(s)
  }
  const det = document.createElement('details')
  det.className = 'multi'
  det.innerHTML = `<summary>${rotulo}: todos</summary><div class="opts">${valores.map((v) => `<label><input type="checkbox" value="${esc(v)}"> ${esc(v)}</label>`).join('')}</div>`
  sel[k] = () => [...det.querySelectorAll('input:checked')].map((i) => i.value)
  det.addEventListener('change', () => {
    const v = sel[k]()
    det.firstChild.textContent = `${rotulo}: ${v.length ? v.length + ' selecionado(s)' : 'todos'}`
    render()
  })
  alvo.append(det)
})
document.addEventListener('click', (e) => document.querySelectorAll('details.multi[open]').forEach((d) => d.contains(e.target) || d.removeAttribute('open')))
q.addEventListener('input', render)
board.addEventListener('click', (e) => {
  const c = e.target.closest('.card')
  if (c && !e.target.closest('a, .desc')) c.querySelector('.desc').hidden = !c.querySelector('.desc').hidden
})
render()
</script>
</body>
</html>
