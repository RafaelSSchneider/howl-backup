<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Howl Simples</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; padding: 16px; background: #fff; color: #111 }
  h1 { font-size: 18px; margin: 0 0 4px }
  p { margin: 0 0 12px; color: #555 }
  .barra { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px }
  #filtros { display: contents }
  #q { width: 100%; max-width: 280px; height: 34px; padding: 6px 10px; font-size: 14px; box-sizing: border-box; border: 1px solid #bbb; border-radius: 17px }
  details.multi { position: relative }
  details.multi summary { list-style: none; display: inline-flex; align-items: center; gap: 4px; height: 34px; padding: 0 12px; border: 1px solid #bbb; border-radius: 17px; background: #fff; cursor: pointer; white-space: nowrap; font-size: 14px }
  details.multi summary::-webkit-details-marker { display: none }
  details.multi summary::after { content: '▾'; color: #777 }
  details.multi[open] summary, details.multi summary:hover { border-color: #555 }
  details.multi .v { color: #555; max-width: 180px; overflow: hidden; text-overflow: ellipsis }
  details.multi .opts { position: absolute; top: 38px; left: 0; z-index: 10; background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 6px 22px 6px 6px; width: max-content; min-width: 200px; max-width: 90vw; max-height: 60vh; overflow-y: auto; overflow-x: hidden; box-shadow: 0 4px 12px #0002 }
  details.multi input { margin: 0; width: 15px; height: 15px; flex: none }
  details.multi label { display: flex; gap: 6px; align-items: center; padding: 4px; white-space: nowrap; cursor: pointer; border-radius: 4px }
  details.multi label:hover { background: #f2f2f2 }
  .abas { display: flex; gap: 4px; border-bottom: 1px solid #ddd; margin-bottom: 8px }
  .abas a { padding: 8px 14px; color: #555; text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 600 }
  .abas a.ativa { color: #111; border-bottom-color: #111 }
  #semana { display: grid; grid-template-columns: repeat(5, minmax(200px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 16px }
  .dia h2 span { color: #777; font-weight: 400 }
  .dia .sub { font-size: 12px; color: #555; margin: 8px 0 6px; font-weight: 600 }
  .pessoa { background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 6px 8px; margin-bottom: 6px }
  .pessoa small { display: block; color: #666; font-size: 12px }
  .aviso { background: #fff7d6; border: 1px solid #f0d77a; border-radius: 4px; padding: 6px 8px; margin-bottom: 6px; font-size: 13px }
  .vazio { color: #888; font-style: italic }
  .quadro { margin-bottom: 16px; border: 1px solid #e3e3e3; border-radius: 8px }
  .quadro-topo { display: flex; align-items: center; gap: 6px; width: 100%; padding: 10px 12px; border: 0; background: #fafafa; border-radius: 8px; font: 600 15px system-ui, sans-serif; cursor: pointer; text-align: left }
  .quadro-topo small { color: #777; font-weight: 400 }
  .quadro-topo:hover { background: #f0f0f0 }
  .seta { display: inline-block; transition: transform .15s }
  .quadro.oculto .seta { transform: rotate(-90deg) }
  .quadro.oculto .colunas { display: none }
  .colunas .col { max-height: 75vh; overflow-y: auto }
  .colunas { display: flex; gap: 12px; overflow-x: auto; align-items: flex-start; padding: 0 8px 12px }
  .col { flex: 0 0 280px; background: #f4f4f4; border-radius: 6px; padding: 8px }
  .col h2 { font-size: 13px; margin: 0 0 8px; text-transform: uppercase }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 8px; margin-bottom: 8px; cursor: pointer }
  .card:hover { border-color: #999 }
  .cod { font-weight: 600; font-size: 12px; color: #555 }
  .meta { font-size: 12px; color: #555; margin-top: 4px }
  dialog { width: min(760px, 94vw); max-height: 88vh; border: 0; border-radius: 8px; padding: 24px; box-shadow: 0 8px 32px #0005 }
  .texto { white-space: normal }
  .texto p { margin: 0 0 1em }
  .texto .l { white-space: pre-wrap; margin-bottom: 0.45em }
  .texto .h { font-weight: 700; font-size: 16px; margin: 0.6em 0 0.4em }
  dialog::backdrop { background: #0006 }
  dialog h3 { margin: 4px 0 8px; font-size: 20px }
  dialog .x { float: right; border: 0; background: none; font-size: 28px; line-height: 1; cursor: pointer }
  .texto { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; line-height: 1.6; max-width: 72ch; margin-top: 16px; padding-top: 16px; border-top: 1px solid #ddd }
  a { color: #0645ad }
</style>
</head>
<body>
<nav class="abas"><a href="#demandas">Demandas</a><a href="#escala">Escala da semana</a></nav>
<p>Atualizado em __GERADO__</p>
<section id="aba-demandas">
<h1>Demandas em aberto <small id="n"></small></h1>
<div class="barra">
<input id="q" type="search" placeholder="Pesquisar código, título, dev, QA, analista, status…" autofocus>
<span id="filtros"></span>
</div>
<div id="board"></div>
</section>
<section id="aba-escala" hidden>
<h1>Escala da semana <small id="periodo"></small></h1>
<div id="semana"></div>
</section>
<dialog id="m"></dialog>
<script>
let dados = __DADOS__
const m = document.getElementById('m'), board = document.getElementById('board'), n = document.getElementById('n'), q = document.getElementById('q')
const FILTROS = [['projeto', 'Projeto', true], ['status', 'Status', true], ['dev', 'Dev', true], ['qa', 'QA', true], ['analista', 'Analista', true]]
const sel = {}
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
// Aceita URL com ou sem protocolo, com espaços ou dentro de texto.
const figmaUrl = (u) => {
  const m = String(u ?? '').match(/(?:https?:\/\/)?(?:[\w-]+\.)?figma\.com\/[^\s"'<>]*/i)
  return m ? (/^https?:/i.test(m[0]) ? m[0] : 'https://' + m[0]) : ''
}
const link = (u) => (figmaUrl(u) ? ` · <a href="${esc(figmaUrl(u))}" target="_blank" rel="noopener">Figma</a>` : '')

// Colunas por nome de status: nomes repetidos (de fluxos diferentes) viram uma só, na menor ordem.
const ordem = {}
dados.forEach((d) => { ordem[d.status] = Math.min(ordem[d.status] ?? Infinity, d.ordem) })
const colunas = Object.keys(ordem).sort((a, b) => ordem[a] - ordem[b])

// Descrição legível: parágrafos (linha em branco) separados, cada linha com respiro, Markdown básico (## e **).
const linha = (l) => {
  const h = l.match(/^#{1,6}\s+(.*)/)
  const s = esc(h ? h[1] : l).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
  return h ? `<div class="h">${s}</div>` : `<div class="l">${s}</div>`
}
const texto = (s) => s.split('\n\n').map((p) => `<p>${p.split('\n').map(linha).join('')}</p>`).join('')

const card = (d) => `<div class="card" data-i="${dados.indexOf(d)}"><div class="cod">${esc(d.codigo)}</div>${esc(d.titulo)}
  <div class="meta">${esc(d.projeto)}${link(d.figma)}</div>
  <div class="meta">Dev: ${esc(d.dev) || '-'} · QA: ${esc(d.qa) || '-'} · Analista: ${esc(d.analista) || '-'}</div></div>`

// Quadros recolhidos ficam salvos só neste navegador; sem localStorage, tudo começa aberto.
const CHAVE_OCULTOS = 'howl-simples:quadros-ocultos'
let ocultos = new Set()
try { ocultos = new Set(JSON.parse(localStorage.getItem(CHAVE_OCULTOS)) || []) } catch {}
const salvarOcultos = () => { try { localStorage.setItem(CHAVE_OCULTOS, JSON.stringify([...ocultos])) } catch {} }

// Quadros na ordem do id; cada um mostra só as colunas de status que ele usa.
const quadros = [...new Map(dados.map((d) => [String(d.quadroId), d.quadro])).entries()].sort((a, b) => a[0] - b[0])
const colunasDo = {}
quadros.forEach(([id]) => { colunasDo[id] = colunas.filter((c) => dados.some((d) => String(d.quadroId) === id && d.status === c)) })

function render() {
  const f = q.value.toLowerCase()
  const lista = dados.filter((d) => FILTROS.every(([k]) => { const v = sel[k](); return !v.length || v.includes(d[k]) }) && Object.values(d).join(' ').toLowerCase().includes(f))
  n.textContent = `(${lista.length})`
  board.innerHTML = quadros.map(([id, nome]) => {
    const doQuadro = lista.filter((d) => String(d.quadroId) === id)
    if (!doQuadro.length) return '' // filtro/busca sem resultado neste quadro
    const cols = colunasDo[id].map((c) => {
      const cards = doQuadro.filter((d) => d.status === c)
      return `<div class="col"><h2>${esc(c)} (${cards.length})</h2>${cards.map(card).join('')}</div>`
    }).join('')
    return `<section class="quadro${ocultos.has(id) ? ' oculto' : ''}" data-q="${id}">
      <button class="quadro-topo" aria-expanded="${!ocultos.has(id)}"><span class="seta">▾</span> ${esc(nome)} <small>(${doQuadro.length})</small></button>
      <div class="colunas">${cols}</div></section>`
  }).join('') || '<p class="vazio">Nenhuma demanda encontrada.</p>'
}

FILTROS.forEach(([k, rotulo]) => {
  const valores = [...new Set(dados.map((d) => d[k]).filter(Boolean))].sort()
  const det = document.createElement('details')
  det.className = 'multi'
  det.innerHTML = `<summary><b>${rotulo}</b> <span class="v">todos</span></summary><div class="opts">${valores.map((v) => `<label><input type="checkbox" value="${esc(v)}"> ${esc(v)}</label>`).join('')}</div>`
  sel[k] = () => [...det.querySelectorAll('input:checked')].map((i) => i.value)
  det.addEventListener('change', () => {
    const v = sel[k]()
    det.querySelector('.v').textContent = v.length === 1 ? v[0] : v.length ? `${v.length} selecionados` : 'todos'
    render()
  })
  document.getElementById('filtros').append(det)
})
document.addEventListener('click', (e) => document.querySelectorAll('details.multi[open]').forEach((d) => d.contains(e.target) || d.removeAttribute('open')))
q.addEventListener('input', render)
board.addEventListener('click', (e) => {
  const topo = e.target.closest('.quadro-topo')
  if (topo) {
    const s = topo.parentElement, id = s.dataset.q
    ocultos.has(id) ? ocultos.delete(id) : ocultos.add(id)
    s.classList.toggle('oculto', ocultos.has(id))
    topo.setAttribute('aria-expanded', !ocultos.has(id))
    return salvarOcultos()
  }
  const c = e.target.closest('.card')
  if (!c || e.target.closest('a')) return
  const d = dados[c.dataset.i]
  m.innerHTML = `<button class="x" aria-label="Fechar">&times;</button>
    <div class="cod">${esc(d.codigo)} · ${esc(d.status)}</div>
    <h3>${esc(d.titulo)}</h3>
    <div class="meta">${esc(d.projeto)}${link(d.figma)}</div>
    <div class="meta">Dev: ${esc(d.dev) || '-'} · QA: ${esc(d.qa) || '-'} · Analista: ${esc(d.analista) || '-'}</div>
    <div class="texto">${d.descricao ? texto(d.descricao) : '<p><i>Sem descrição</i></p>'}</div>`
  m.showModal()
  m.scrollTop = 0
})
m.addEventListener('click', (e) => { if (e.target === m || e.target.closest('.x')) m.close() })
render()

// ── Aba Escala ────────────────────────────────────────────────────────────
const escala = __ESCALA__
const NOMES_DIA = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta']
const dm = (ymd) => ymd.slice(8, 10) + '/' + ymd.slice(5, 7)
document.getElementById('periodo').textContent = `(${dm(escala.dias[0])} a ${dm(escala.dias[4])})`
document.getElementById('semana').innerHTML = escala.dias.map((dia, i) => {
  const avisos = [
    ...escala.reunioes.filter((r) => r.data === dia).map((r) => `📅 ${esc(r.titulo)}`),
    ...escala.trocas.filter((t) => t.feriado === dia).map((t) => `Feriado trocado: ${esc(t.nome)} (compensa ${dm(t.compensacao)})`),
    ...escala.trocas.filter((t) => t.compensacao === dia).map((t) => `Compensação do feriado ${esc(t.nome)}`),
    ...escala.especiais.filter((e) => e.data === dia).map((e) => `${e.tipo === 'trancado' ? 'Dia trancado' : esc(e.tipo)}${e.nome ? ' · ' + esc(e.nome) : ''}${e.motivo ? ': ' + esc(e.motivo) : ''}`),
  ]
  const ho = escala.homeOffice.filter((h) => h.data === dia)
  return `<div class="col dia"><h2>${NOMES_DIA[i]} <span>${dm(dia)}</span></h2>
    ${avisos.map((a) => `<div class="aviso">${a}</div>`).join('')}
    <div class="sub">Home office (${ho.length})</div>
    ${ho.map((h) => `<div class="pessoa">${esc(h.nome)}<small>${esc(h.setor) || ''}</small></div>`).join('') || '<div class="vazio">Ninguém</div>'}
  </div>`
}).join('')

const abas = () => {
  const escalaAtiva = location.hash === '#escala'
  document.getElementById('aba-demandas').hidden = escalaAtiva
  document.getElementById('aba-escala').hidden = !escalaAtiva
  document.querySelectorAll('.abas a').forEach((a) => a.classList.toggle('ativa', a.hash === (escalaAtiva ? '#escala' : '#demandas')))
}
addEventListener('hashchange', abas)
abas()
</script>
</body>
</html>
